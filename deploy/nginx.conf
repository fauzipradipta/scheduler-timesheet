# Nginx site for the scheduler timesheet app.
#
# Install on the VPS with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/scheduler-timesheet
#   sudo ln -sf /etc/nginx/sites-available/scheduler-timesheet /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace REPLACE_WITH_YOUR_DOMAIN below before installing. Certbot rewrites
# this file to add the TLS block once a certificate is issued.

server {
    listen 80;
    listen [::]:80;

    server_name REPLACE_WITH_YOUR_DOMAIN;

    # Laravel serves everything through public/, never the project root.
    root /var/www/scheduler-timesheet/public;
    index index.php;

    charset utf-8;

    # The generated timesheet is an .xlsx download, so give uploads room.
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite writes hashed filenames, so these can be cached hard.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Building the workbook can outrun the default timeout on a small VPS.
        fastcgi_read_timeout 120;
    }

    # Nothing dotted is ever meant to be served, .env above all.
    location ~ /\. {
        deny all;
    }

    error_page 404 /index.php;

    access_log /var/log/nginx/scheduler-timesheet.access.log;
    error_log  /var/log/nginx/scheduler-timesheet.error.log;
}
